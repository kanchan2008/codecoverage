<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy Applications</title>
</head>
<body>
    <h2>Enter Application Versions</h2>
    <form id="deployForm">
        <label>App 1: <input type="text" name="app1" required></label>
        <label>App 2: <input type="text" name="app2" required></label>
        <label>App 3: <input type="text" name="app3" required></label>
        <button type="submit">Deploy</button>
    </form>

    <script>
        document.getElementById('deployForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            let formData = new FormData(event.target);
            let appVersions = {};

            formData.forEach((value, key) => {
                appVersions[key] = value;
            });

            let issueTitle = "Deployment Request";
            let issueBody = `### Deployment Request\n\n\`\`\`json\n${JSON.stringify(appVersions, null, 2)}\n\`\`\``;

            let response = await fetch("https://api.github.com/repos/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/issues", {
                method: "POST",
                headers: {
                    "Accept": "application/vnd.github.v3+json",
                    "Authorization": "Bearer YOUR_GITHUB_PERSONAL_ACCESS_TOKEN",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: issueTitle,
                    body: issueBody
                })
            });

            if (response.ok) {
                alert("Deployment request created!");
            } else {
                alert("Failed to create issue.");
                console.error(await response.json());
            }
        });
    </script>
</body>
</html>
