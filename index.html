<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy Applications</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: auto; }
        label, input { display: block; margin: 10px 0; }
        button { padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Enter Application Versions</h2>
    <form id="deployForm">
        <label>App 1: <input type="text" name="app1" required></label>
        <label>App 2: <input type="text" name="app2" required></label>
        <label>App 3: <input type="text" name="app3" required></label>
        <button type="submit">Trigger Deployment</button>
    </form>

    <script>
        document.getElementById('deployForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let formData = new FormData(event.target);
            let appVersions = {};
            formData.forEach((value, key) => { appVersions[key] = value; });

            let jsonVersions = JSON.stringify(appVersions);
            
            // Construct GitHub Actions workflow dispatch URL
            let githubURL = `https://github.com/kanchan2008/codecoverage/actions/workflows/deploy.yml?inputs[app_versions]=${encodeURIComponent(jsonVersions)}`;

            // Redirect user to GitHub Actions page to manually trigger workflow
            window.location.href = githubURL;
        });
    </script>
</body>
</html>
