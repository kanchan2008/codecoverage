name: CI with GitHub Notifications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  issues: write    # Required to create issues
  contents: read   # Required to checkout code

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Failing step
      run: |
        echo "This step will fail"
        exit 1  # Force failure    
    
    # Your existing workflow steps here
    - name: Run your tests
      run: |
        echo "Running tests..."
        # Your actual test commands here

    # Send notification on failure using GitHub's native features
    - name: Notify team of failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Workflow Failed: ${{ github.workflow }}',
            body: `## Workflow Failure Alert
            
            The workflow **${{ github.workflow }}** has failed!
            
            ### Details
            - **Repository:** ${{ github.repository }}
            - **Workflow Run:** [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Triggered by:** ${context.eventName}
            - **Branch:** ${{ github.ref }}
            - **Commit:** ${{ github.sha }}
            
            Please check the workflow logs for more details.
            
            /cc @organization-name/team-name`
          });
